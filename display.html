<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マーダーミステリー タイマー［表示画面］</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #ffffff;
      color: #0a1a2a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ヘッダーバー */
    .top-bar {
      background: #1a3a5a;
      padding: 12px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #2a5a8a;
    }

    .top-bar-title {
      font-size: 13px;
      color: #7ab0d4;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4aaa70;
    }

    .status-dot.idle { background: #888; }

    .status-label {
      font-size: 11px;
      color: #4aaa70;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .status-label.idle { color: #888; }

    .game-title-bar {
      font-size: 12px;
      color: #5a8ab0;
      letter-spacing: 0.08em;
    }

    /* メインコンテンツ */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 32px;
    }

    /* フェーズ情報 */
    .phase-index {
      font-size: 40px;
      color: #2a5a8a;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .phase-name {
      font-size: 70px;
      font-weight: 500;
      color: #0a1a2a;
      margin-bottom: 40px;
      text-align: center;
    }

    /* タイマー */
    .timer-wrap {
      border: 1.5px solid #2a5a8a;
      border-radius: 12px;
      padding: 32px 64px;
      margin-bottom: 40px;
      background: #f4f8fc;
      text-align: center;
      min-width: 360px;
    }

    .timer-label {
      font-size: 40px;
      color: #6a8aaa;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .timer-display {
      font-size: 200px;
      font-weight: 300;
      color: #0a2a4a;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
      font-family: 'Courier New', 'Courier', monospace;
      line-height: 1;
      transition: color 0.5s;
    }

    .timer-display.warning { color: #c03030; }

    /* 進行状況エリア */
    .progress-area {
      width: 100%;
      max-width: 560px;
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .progress-side-label {
      font-size: 12px;
      color: #6a8aaa;
      letter-spacing: 0.08em;
      width: 64px;
      flex-shrink: 0;
    }

    .progress-track {
      flex: 1;
      height: 6px;
      background: #dde8f0;
      border-radius: 3px;
    }

    .progress-fill {
      height: 6px;
      border-radius: 3px;
      background: #1a6aaa;
      transition: width 1s linear;
    }

    .progress-pct {
      font-size: 12px;
      color: #1a6aaa;
      width: 36px;
      text-align: right;
      flex-shrink: 0;
    }

    /* フェーズ pip */
    .phase-pips {
      display: flex;
      gap: 6px;
      justify-content: center;
    }

    .phase-pip {
      height: 5px;
      border-radius: 3px;
      transition: background 0.3s;
    }

    .phase-pip.done     { background: #1a6aaa; }
    .phase-pip.current  { background: #378ADD; }
    .phase-pip.upcoming { background: #dde8f0; }

    /* フッター */
    .footer {
      background: #f0f4f8;
      border-top: 1px solid #dde8f0;
      padding: 10px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-label {
      font-size: 11px;
      color: #8aaac0;
      letter-spacing: 0.08em;
    }

    /* 待機画面 */
    .standby {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 16px;
    }

    .standby-title {
      font-size: 28px;
      font-weight: 300;
      color: #2a5a8a;
      letter-spacing: 0.1em;
    }

    .standby-sub {
      font-size: 14px;
      color: #8aaac0;
      letter-spacing: 0.08em;
    }

    /* 終了画面 */
    .finish {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 16px;
      text-align: center;
    }

    .finish-title {
      font-size: 36px;
      font-weight: 300;
      color: #1a3a5a;
      letter-spacing: 0.08em;
    }

    .finish-sub {
      font-size: 16px;
      color: #6a8aaa;
    }

    /* 文章表示モード */
    .text-view {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 60px 100px;
      text-align: center;
      gap: 40px;
    }

    .text-view-title {
      font-size: 64px;
      font-weight: 500;
      color: #0a1a2a;
      line-height: 1.3;
    }

    .text-view-body {
      font-size: 34px;
      color: #2a4a6a;
      line-height: 1.9;
      white-space: pre-wrap;
      max-width: 1100px;
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <div class="top-bar">
    <div class="top-bar-title">Mizuhara Laboratory Timer System</div>
    <div style="display:flex; align-items:center; gap:20px;">
      <div class="game-title-bar" id="gameTitleBar">—</div>
      <div class="top-bar-right">
        <div class="status-dot idle" id="statusDot"></div>
        <div class="status-label idle" id="statusLabel">STANDBY</div>
      </div>
    </div>
  </div>

  <!-- 待機画面 -->
  <div class="standby" id="viewStandby" style="display:flex;">
    <div class="standby-title">MIZUHARA LABORATORY TIMER SYSTEM</div>
    <div class="standby-sub">iPad操作画面から開始してください</div>
  </div>

  <!-- タイマー画面 -->
  <div class="main" id="viewMain" style="display:none;">
    <div class="phase-index" id="phaseIndex">PHASE 1 / 4</div>
    <div class="phase-name" id="phaseName">—</div>

    <div class="timer-wrap">
      <div class="timer-label">REMAINING TIME</div>
      <div class="timer-display" id="timerDisplay">--:--</div>
    </div>

  </div>

  <!-- 終了画面 -->
  <div class="finish" id="viewFinish" style="display:none;">
    <div class="finish-title">ALL PHASES COMPLETE</div>
    <div class="finish-sub" id="finishGameTitle"></div>
  </div>

  <!-- 文章表示画面 -->
  <div class="text-view" id="viewText">
    <div class="text-view-title" id="textViewTitle"></div>
    <div class="text-view-body" id="textViewBody"></div>
  </div>

  <!-- iframe表示画面 -->
  <div id="viewIframe" style="display:none; flex:1; position:relative;">
    <iframe id="iframeContent" src="about:blank" style="position:absolute; inset:0; width:100%; height:100%; border:none;"></iframe>
  </div>


  <!-- フッター -->
  <div class="footer">
    <div class="footer-label">MURDER MYSTERY TIMER — DISPLAY</div>
    <div class="footer-label" id="footerTime"></div>
  </div>

  <script>
    // ===== index.html と共有するデータキー =====
    const STORAGE_KEY = 'mmTimerData';
    const STATE_KEY   = 'mmTimerState';

    // ===== フェーズタイプ定義（index.html と同一内容を維持する） =====
 const PHASE_TYPES = {
  'donyu':   { mode: 'donyu', label: '導入',        url: 'testhtml.html' },
  '???':     { mode: 'donyu', label: '???',         url: 'question.html' },
  'endding': { mode: 'donyu', label: 'エンディング', url: 'endding.html' },
  'action':  { mode: 'donyu', label: 'アクション',   url: 'action.html' },
  'timer':   { mode: 'timer', label: 'タイマー' },
  'ending':  { mode: 'text',  label: 'エンディング' },
};

    let lastState = null;

    // フッター時計
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('footerTime').textContent = h + ':' + m + ':' + s;
    }

    setInterval(updateClock, 1000);
    updateClock();

    // フォーマット
    function fmt(secs) {
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    // pip描画
    function renderPips(phases, currentPhase) {
      const el = document.getElementById('phasePips');
      const pipW = Math.min(60, Math.floor(480 / phases.length) - 6);
      el.innerHTML = phases.map((_, i) => {
        const cls = i < currentPhase ? 'done' : i === currentPhase ? 'current' : 'upcoming';
        return `<div class="phase-pip ${cls}" style="width:${pipW}px;"></div>`;
      }).join('');
    }

    // iframe表示モード
    function applyIframeMode(url, statusLabel) {
      document.getElementById('viewStandby').style.display = 'none';
      document.getElementById('viewMain').style.display    = 'none';
      document.getElementById('viewFinish').style.display  = 'none';
      document.getElementById('viewText').style.display    = 'none';
      document.getElementById('viewIframe').style.display  = 'flex';

      const iframe = document.getElementById('iframeContent');
      if (iframe.getAttribute('src') !== url) iframe.src = url;

      const statusDot = document.getElementById('statusDot');
      const statusLbl = document.getElementById('statusLabel');
      statusDot.className = 'status-dot';
      statusLbl.className = 'status-label';
      statusLbl.textContent = statusLabel || 'DISPLAY';
    }

    // 文章表示モード
    function applyTextMode(textData, statusLabel) {
      document.getElementById('viewStandby').style.display = 'none';
      document.getElementById('viewMain').style.display    = 'none';
      document.getElementById('viewFinish').style.display  = 'none';
      document.getElementById('viewText').style.display    = 'flex';
      document.getElementById('viewIframe').style.display  = 'none';

      document.getElementById('textViewTitle').textContent = textData.title || '';
      document.getElementById('textViewBody').textContent  = textData.body  || '';

      const statusDot = document.getElementById('statusDot');
      const statusLbl = document.getElementById('statusLabel');
      statusDot.className = 'status-dot';
      statusLbl.className = 'status-label';
      statusLbl.textContent = statusLabel || 'TEXT';
    }

    // 画面更新
    function applyState(state, phases, gameTitle) {
      // ゲームタイトル
      document.getElementById('gameTitleBar').textContent = gameTitle || '—';

      const timerEl   = document.getElementById('timerDisplay');
      const statusDot = document.getElementById('statusDot');
      const statusLbl = document.getElementById('statusLabel');

      // 文章・iframe表示を常に非表示にする（タイマーモード時）
      document.getElementById('viewText').style.display   = 'none';
      document.getElementById('viewIframe').style.display = 'none';

      if (state.view === 'standby') {
        document.getElementById('viewStandby').style.display = 'flex';
        document.getElementById('viewMain').style.display    = 'none';
        document.getElementById('viewFinish').style.display  = 'none';
        statusDot.className = 'status-dot idle';
        statusLbl.className = 'status-label idle';
        statusLbl.textContent = 'STANDBY';
        return;
      }

      if (state.view === 'finish') {
        document.getElementById('viewStandby').style.display = 'flex';
        document.getElementById('viewStandby').style.display = 'none';
        document.getElementById('viewMain').style.display    = 'none';
        document.getElementById('viewFinish').style.display  = 'flex';
        document.getElementById('finishGameTitle').textContent = gameTitle || '';
        statusDot.className = 'status-dot idle';
        statusLbl.className = 'status-label idle';
        statusLbl.textContent = 'COMPLETE';
        return;
      }

      // タイマー画面
      document.getElementById('viewStandby').style.display = 'none';
      document.getElementById('viewMain').style.display    = 'flex';
      document.getElementById('viewFinish').style.display  = 'none';

      const p = phases[state.currentPhase];
      document.getElementById('phaseIndex').textContent =
        'PHASE ' + (state.currentPhase + 1) + ' / ' + 7;
      document.getElementById('phaseName').textContent = p.name;

      timerEl.textContent = fmt(state.remaining);
      timerEl.className = 'timer-display' + (state.remaining <= 60 && state.remaining > 0 ? ' warning' : '');

      // 進行率（全フェーズの合計時間に対する経過時間）
      //const totalSecs  = phases.reduce((s, ph) => s + ph.minutes * 60, 0);
      //const doneSecs   = phases.slice(0, state.currentPhase).reduce((s, ph) => s + ph.minutes * 60, 0);
      //const elapsed    = doneSecs + (p.minutes * 60 - state.remaining);
      //const pct        = Math.round(elapsed / totalSecs * 100);
      //document.getElementById('progressFill').style.width = pct + '%';
      //document.getElementById('progressPct').textContent  = pct + '%';

      renderPips(phases, state.currentPhase);

      // ステータス
      if (state.running) {
        statusDot.className = 'status-dot';
        statusLbl.className = 'status-label';
        statusLbl.textContent = 'ACTIVE';
      } else {
        statusDot.className = 'status-dot idle';
        statusLbl.className = 'status-label idle';
        statusLbl.textContent = 'PAUSED';
      }
    }

    // ポーリング（500msごとにlocalStorageを監視）
    function poll() {
      try {
        const rawData  = localStorage.getItem(STORAGE_KEY);
        const rawState = localStorage.getItem(STATE_KEY);
        if (!rawData || !rawState) return;

        const data  = JSON.parse(rawData);
        const state = JSON.parse(rawState);

        // 変化があった時だけ更新
        const stateStr = JSON.stringify(state);
        if (stateStr === lastState) return;
        lastState = stateStr;

        // ゲームタイトルを更新
        document.getElementById('gameTitleBar').textContent = data.gameTitle || '—';

        // standby / finish はそのままapplyStateへ
        if (state.view === 'standby' || state.view === 'finish') {
          applyState(state, data.phases, data.gameTitle);
          return;
        }

        // timerビュー：フェーズのtypeを毎回確認して表示を切り替える
        if (state.view === 'timer') {
          const phase    = data.phases[state.currentPhase];
          const typeInfo = PHASE_TYPES[phase?.type] || PHASE_TYPES['timer'];

          if (typeInfo.url) {
            // iframeモード（donyu / ??? など）
            applyIframeMode(typeInfo.url, typeInfo.label);
            return;
          }

          if (typeInfo.mode === 'text') {
            // 文章モード（ending など）
            applyTextMode(
              { title: phase.displayTitle || '', body: phase.displayBody || '' },
              typeInfo.label
            );
            return;
          }

          // timerモード：通常のタイマー表示
          applyState(state, data.phases, data.gameTitle);
          return;
        }

      } catch(e) { console.error(e); }
    }

    setInterval(poll, 500);
    poll();
  </script>

</body>
</html>
